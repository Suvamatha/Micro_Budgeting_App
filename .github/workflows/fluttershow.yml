# FlutterShow: Flutter Web Build & Deploy
# Generated for Suvamatha/Micro_Budgeting_App
# Do not edit the "FlutterShow" section manually.

name: FlutterShow Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run, so the developer does not
          # need to visit Repository Settings → Pages manually.
          enablement: true

      - name: Build for web
        run: flutter build web --release --base-href /Micro_Budgeting_App/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
